name: CI/CD for SaferX Admin Frontend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Checkout repo
      uses: actions/checkout@v3

    - name: 🛠 Setup Node.js 20 (for build only)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 📥 Install dependencies
      run: npm install

    - name: 🔧 Build project
      run: NEXT_DISABLE_ESLINT_PLUGIN=true npm run build

    - name: 📂 Prepare artifact
      run: |
        mkdir deploy
        cp -r .next public package.json ecosystem.config.js .env deploy/

    - name: 🧼 Ensure target folder exists
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          sudo mkdir -p /var/www/html/saferx-temp
          sudo chown -R $USER:$USER /var/www/html/

    - name: 🚀 Upload files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "deploy/"
        target: "/var/www/html/saferx-temp"
        strip_components: 1
        overwrite: true

    - name: 🔁 Swap, install, and restart with PM2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22

          sudo rm -rf /var/www/html/saferx
          sudo mv /var/www/html/saferx-temp /var/www/html/saferx
          sudo chown -R $USER:$USER /var/www/html/saferx

          cd /var/www/html/saferx
          npm install --omit=dev

          pm2 delete saferx || true
          pm2 start ecosystem.config.js
          pm2 save
