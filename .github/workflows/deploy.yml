name: CI/CD for SaferX

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Deploy to saferx.syndev.us
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: ".next,public,package.json,ecosystem.config.js"
        target: "/var/www/html/saferx-temp"

    - name: Restart app with PM2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          pm2 stop saferx || true
          rm -rf /var/www/html/saferx
          mv /var/www/html/saferx-temp /var/www/html/saferx
          cd /var/www/html/saferx
          npm ci --omit=dev
          pm2 start ecosystem.config.js --name saferx
          pm2 save
